# Copy to config.toml and edit. Run with: kwkly [path/to/config.toml]

# Your GitHub login. Used to skip your own comments, and (with only_my_prs)
# to watch only PRs you authored.
username = "sergerad"

# Repositories to watch, "owner/name".
repos = [
  # "rust-lang/rust",
  "0xMiden/miden-node"
]

# Where clones, worktrees, and review artifacts land.
inbox_dir = "~/agent-inbox"

# How often to poll GitHub, and how long a PR must be "quiet" after the last
# new comment before an agent run is dispatched (batches comment bursts).
poll_interval_secs = 120
debounce_secs = 300

# Agent runtime.
max_concurrent_agents = 2
max_turns = 40
claude_bin = "claude"

# Only react to PRs you authored (false = all open PRs in the repo).
only_my_prs = true

# Env var holding a fine-grained PAT with READ-ONLY permissions:
#   Contents: Read, Issues: Read, Pull requests: Read  (on the watched repos)
# Read-only is the core safety guarantee — the agent physically cannot write
# to GitHub even if a malicious comment tries to steer it.
github_token_env = "KWKLY_GITHUB_TOKEN"

# Desktop notifications when a task starts and finishes.
# macOS: uses osascript (built in). Linux: needs notify-send (libnotify).
notifications = true

# For Rust repos (Cargo.toml at the worktree root), automatically point
# CARGO_TARGET_DIR at a shared per-repo build-cache dir so PR worktrees don't
# each grow their own target/. On by default; set false to disable.
share_build_cache = true

# Extra env vars for each agent run. "{repo_dir}" expands to the repo's
# directory under inbox_dir. Use for build caches in other ecosystems (e.g.
# GOMODCACHE), anything the repo's tooling needs, or to override the
# CARGO_TARGET_DIR that share_build_cache sets.
# [agent_env]
# GOMODCACHE = "{repo_dir}/go-mod-cache"
