[package]
name = "trpr"
version = "0.2.0"
edition = "2021"
description = "TUI for addressing PR review comments with a Claude Code agent, run inside your checkout"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
